[package]
name = "shoppinglist-core"
version = "0.1.0"
edition = "2024"
license = "GPL3"
publish = false

[dependencies]
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
confy = { version = "2.0.0", default-features = false, features = ["ron_conf"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }
# Iroh deps are minor pinned as they themselves are minor pinning deps.
# Ideally they'd re-export blobs and gossip from docs, but w/e
iroh = "~1.4.1"
iroh-docs = "~0.101.0"
iroh-blobs = "~0.103.1"
iroh-gossip = "~0.101.0"
n0-error = { version = "1.0.3", features = ["anyhow"] }
n0-future = "0.3"
url = "2"
indexmap = { version = "2.14.2", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"
anyhow = "1.0.104"
ractor = { version = "0.16", features = ["actor-macros", "message_span_propogation"] }
ractor_actors = { version = "0.7.0", features = ["streams"] }
adaptive_backoff = "0.2.2"
ron = "~0.11"
iroh-tickets = "1.0.0"
serde_with = "3.25.0"
bytes = "1.12.2"
postcard = "1.2.0"
bilrost = { version = "0.1016.3", default-features = false, features = ["std", "chrono", "derive", "detailed-errors", "auto-optimize", "smallvec"] }
fracindex = { version = "0.4.1", features = ["jitter"] }
smallvec = { version = "1.16.6", features = ["serde"] }
